name = "agent-canvas"
main = "worker/index.ts"
compatibility_date = "2026-10-11"

# Serve the built Canvas SPA as static assets. `run_worker_first` sends every
# request through the Worker so `/api/cloud-proxy` is handled deterministically;
# everything else is delegated to `env.ASSETS.fetch`, which applies the SPA
# fallback for unmatched client-side routes.
[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
